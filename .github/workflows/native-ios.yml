name: Native iOS instrument
on:
  push:
    paths: ['native/**', '.github/workflows/native-ios.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Portable DSP and project tests
        run: CC=clang native/InstrumentDNA/test.sh
      - name: Web and factory preset tests
        run: npm test
      - name: Apple audio unit integration tests
        run: |
          clang -std=c11 -c native/InstrumentDNA/DSP/DNAKernel.c -o "$RUNNER_TEMP/dna-kernel.o"
          clang -std=c11 -c native/InstrumentDNA/DSP/DNAPhysical.c -o "$RUNNER_TEMP/dna-physical.o"
          clang -std=c11 -c native/InstrumentDNA/DSP/DNAPhysicalFit.c -o "$RUNNER_TEMP/dna-fit.o"
          clang++ -std=c++17 -fobjc-arc -I native/InstrumentDNA/DSP -I native/InstrumentDNA/Shared native/InstrumentDNA/Tests/apple_unit_test.mm native/InstrumentDNA/Shared/DNAudioUnit.mm "$RUNNER_TEMP/dna-kernel.o" "$RUNNER_TEMP/dna-physical.o" "$RUNNER_TEMP/dna-fit.o" -framework Foundation -framework AVFoundation -framework AudioToolbox -framework CoreAudioKit -o "$RUNNER_TEMP/dna-unit-test"
          "$RUNNER_TEMP/dna-unit-test"
      - name: Test native extraction and articulation editing
        run: |
          swiftc native/InstrumentDNA/Shared/NativeAnalyzer.swift native/InstrumentDNA/Shared/NoteMap.swift native/InstrumentDNA/Tests/model/main.swift -o "$RUNNER_TEMP/dna-model-test"
          "$RUNNER_TEMP/dna-model-test"
      - name: Build standalone app and embedded AUv3
        run: |
          set -o pipefail
          xcodebuild -project native/InstrumentDNA/InstrumentDNA.xcodeproj -scheme InstrumentDNA -configuration Debug -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/InstrumentDNA" CODE_SIGNING_ALLOWED=NO build | tee "$RUNNER_TEMP/native-build.log"
      - name: Verify iPadOS 15.4.1 compatible Release device bundles
        run: |
          set -o pipefail
          xcodebuild -project native/InstrumentDNA/InstrumentDNA.xcodeproj -scheme InstrumentDNA -configuration Release -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/InstrumentDNA-device" CODE_SIGNING_ALLOWED=NO build | tee "$RUNNER_TEMP/native-device-build.log"
          python3 - "$RUNNER_TEMP/InstrumentDNA-device/Build/Products/Release-iphoneos/InstrumentDNA.app" <<'PY'
          import pathlib, plistlib, sys
          app = pathlib.Path(sys.argv[1])
          for bundle in [app, app / 'PlugIns/InstrumentDNAInstrument.appex']:
              info = plistlib.loads((bundle / 'Info.plist').read_bytes())
              assert info['MinimumOSVersion'] == '15.4', (bundle, info['MinimumOSVersion'])
              assert info['CFBundleShortVersionString'] == '0.4.3'
              assert info['CFBundleVersion'] == '10'
              print(f"{bundle.name}: iOS minimum {info['MinimumOSVersion']}, version 0.4.3 build 10")
          PY
      - name: Launch standalone app in iPad simulator
        timeout-minutes: 10
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for devices in d["devices"].values() for x in devices if "iPad" in x["name"]))')
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          codesign --force --sign - "$RUNNER_TEMP/InstrumentDNA/Build/Products/Debug-iphonesimulator/InstrumentDNA.app/PlugIns/InstrumentDNAInstrument.appex"
          codesign --force --sign - "$RUNNER_TEMP/InstrumentDNA/Build/Products/Debug-iphonesimulator/InstrumentDNA.app"
          xcrun simctl install "$DEVICE" "$RUNNER_TEMP/InstrumentDNA/Build/Products/Debug-iphonesimulator/InstrumentDNA.app"
          xcrun simctl launch --stdout="$RUNNER_TEMP/native-app.log" --stderr="$RUNNER_TEMP/native-app-errors.log" "$DEVICE" org.diallobeats.instrumentdna --editor-smoke-test
          sleep 10
          xcrun simctl io "$DEVICE" screenshot "$RUNNER_TEMP/native-ipad.png"
          xcrun simctl spawn "$DEVICE" launchctl list | grep org.diallobeats.instrumentdna
          grep -q INSTRUMENT_DNA_AUDIO_RECOVERY_PASSED "$RUNNER_TEMP/native-app.log"
          grep -q INSTRUMENT_DNA_READY "$RUNNER_TEMP/native-app.log"
          grep -q INSTRUMENT_DNA_FITTING_TESTS_PASSED "$RUNNER_TEMP/native-app.log"
          grep -q INSTRUMENT_DNA_EDITOR_TESTS_PASSED "$RUNNER_TEMP/native-app.log"
      - name: Host the shipped AUv3 extension and request its remote editor
        timeout-minutes: 3
        run: |
          DEVICE=$(xcrun simctl list devices booted -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for devices in d["devices"].values() for x in devices if x["state"]=="Booted"))')
          xcrun simctl terminate "$DEVICE" org.diallobeats.instrumentdna
          xcrun simctl launch --stdout="$RUNNER_TEMP/native-remote-host.log" --stderr="$RUNNER_TEMP/native-remote-host-errors.log" "$DEVICE" org.diallobeats.instrumentdna --extension-host-smoke-test
          for attempt in $(seq 1 24); do
            if grep -q INSTRUMENT_DNA_EXTENSION_HOST_PASSED "$RUNNER_TEMP/native-remote-host.log"; then break; fi
            if grep -q INSTRUMENT_DNA_EXTENSION_HOST_FAILED "$RUNNER_TEMP/native-remote-host.log"; then break; fi
            sleep 5
          done
          xcrun simctl io "$DEVICE" screenshot "$RUNNER_TEMP/native-remote-editor.png"
          cat "$RUNNER_TEMP/native-remote-host.log"
          grep -q INSTRUMENT_DNA_EXTENSION_HOST_PASSED "$RUNNER_TEMP/native-remote-host.log"
      - name: Collect simulator crash diagnostics
        if: always()
        timeout-minutes: 2
        run: |
          mkdir -p "$RUNNER_TEMP/native-diagnostics"
          find "$HOME/Library/Logs/DiagnosticReports" -name 'InstrumentDNA*.ips' -exec cp {} "$RUNNER_TEMP/native-diagnostics/" \;
          xcrun simctl spawn booted log show --last 3m --style compact --predicate 'process == "InstrumentDNA" OR process == "InstrumentDNAInstrument"' > "$RUNNER_TEMP/native-diagnostics/app-system.log" 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-build-log
          path: |
            ${{ runner.temp }}/native-build.log
            ${{ runner.temp }}/native-device-build.log
            ${{ runner.temp }}/native-ipad.png
            ${{ runner.temp }}/native-app*.log
            ${{ runner.temp }}/native-remote*.log
            ${{ runner.temp }}/native-remote-editor.png
            ${{ runner.temp }}/native-diagnostics
