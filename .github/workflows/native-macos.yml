name: Native macOS AUv3 instrument
on:
  push:
    paths: ['native/InstrumentDNAMac/**', 'native/InstrumentDNA/Shared/**', 'native/InstrumentDNA/DSP/**', 'native/InstrumentDNA/Resources/**', '.github/workflows/native-macos.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: DSP and model regression tests
        run: |
          python3 native/InstrumentDNAMac/Tests/project_test.py
          CC=clang native/InstrumentDNA/test.sh
          npm test
      - name: Build universal macOS app and embedded AUv3
        run: |
          set -o pipefail
          xcodebuild -project native/InstrumentDNAMac/InstrumentDNAMac.xcodeproj -scheme InstrumentDNAMac -configuration Release -destination 'generic/platform=macOS' -derivedDataPath "$RUNNER_TEMP/InstrumentDNAMac" CODE_SIGNING_ALLOWED=NO ARCHS='arm64 x86_64' ONLY_ACTIVE_ARCH=NO build | tee "$RUNNER_TEMP/mac-build.log"
      - name: Verify bundle metadata and register shipped extension
        run: |
          APP="$RUNNER_TEMP/InstrumentDNAMac/Build/Products/Release/InstrumentDNAMac.app"
          EXT="$APP/Contents/PlugIns/InstrumentDNAMacInstrument.appex"
          /usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionAttributes:AudioComponents:0:type' "$EXT/Contents/Info.plist" | grep aumu
          lipo "$APP/Contents/MacOS/InstrumentDNAMac" -verify_arch arm64 x86_64
          lipo "$EXT/Contents/MacOS/InstrumentDNAMacInstrument" -verify_arch arm64 x86_64
          codesign --force --sign - --entitlements native/InstrumentDNAMac/Extension/Instrument.entitlements "$EXT"
          codesign --force --sign - --entitlements native/InstrumentDNAMac/App/App.entitlements "$APP"
          /System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister -f "$APP"
          pluginkit -a "$EXT"
          pluginkit -m -i org.diallobeats.instrumentdna.mac.Instrument
      - name: Test native Mac editor, factory audio and out-of-process AUv3 MIDI
        timeout-minutes: 4
        run: |
          APP="$RUNNER_TEMP/InstrumentDNAMac/Build/Products/Release/InstrumentDNAMac.app"
          open -W -n --stdout "$RUNNER_TEMP/mac-smoke.log" --stderr "$RUNNER_TEMP/mac-smoke-errors.log" "$APP" --args --mac-smoke-test &
          PROBE_PID=$!
          for attempt in $(seq 1 30); do
            if ! kill -0 "$PROBE_PID" 2>/dev/null; then break; fi
            sleep 5
          done
          if kill -0 "$PROBE_PID" 2>/dev/null; then kill "$PROBE_PID"; fi
          cat "$RUNNER_TEMP/mac-smoke.log"
          cat "$RUNNER_TEMP/mac-smoke-errors.log"
          grep -q INSTRUMENT_DNA_MAC_LOCAL_PASSED "$RUNNER_TEMP/mac-smoke.log"
          grep -q INSTRUMENT_DNA_MAC_EXTENSION_PASSED "$RUNNER_TEMP/mac-smoke.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: InstrumentDNA-macOS-test-results
          path: |
            ${{ runner.temp }}/mac-build.log
            ${{ runner.temp }}/mac-smoke*.log
